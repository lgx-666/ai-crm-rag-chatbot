services:
  app:
    build:
      context: . # 用当前目录(AI_CRM)的 Dockerfile，context=AI_CRM
      additional_contexts:
        # torch 那个 184MB 的 wheel 放在项目外的 docker_wheels/ 里。
        # 原因：它在主上下文内就会被 .dockerignore 排除，而实测 .dockerignore 同样会让
        # Dockerfile 里的 RUN --mount=type=bind 取不到文件；单独声明命名上下文 wheels，
        # 既能挂载进来装依赖，`COPY . .` 也永远不会把它打进镜像。
        wheels: ../docker_wheels
    ports:
      - "5000:5000" # 宿主5000 → 容器5000
    env_file:
      - .env # 运行时注入密钥（compose 在宿主读，不打进镜像）
    environment:
      # environment 优先级高于 env_file，用来覆盖
      - EMBEDDING_MODEL=/app/chinese_model/BAAI/bge-base-zh-v1.5 # 把.env里的相对路径换成容器内绝对路径
      - FLASK_DEBUG=0 # 容器里关调试模式
      - ANONYMIZED_TELEMETRY=False # 只表达"不上报"的意图，不承诺静音：实测 chromadb 0.5.3 仍会刷 posthog 的 capture() 参数不兼容报错，那是它自身版本问题、与网络无关，无害但会一直在日志里
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../chinese_model:/app/chinese_model:ro # 嵌入模型，只读挂载（app 只读不写）
      - ./data:/app/data # 向量库+SQLite 持久化，容器删了数据还在
    restart: unless-stopped
    # 问答缓存后端。故意不写 ports:：缓存 value 里存的是完整答案文本，
    # 没必要把 6379 暴露到局域网；容器之间靠 compose 网络用服务名 redis 访问就够了。
  redis:
    image: redis:7-alpine
    # 关掉所有持久化：缓存丢了可以重新生成，不值得为它落盘和管卷
    command: [ "redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
